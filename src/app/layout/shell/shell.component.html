<header class="topbar">
  <div class="inner">
    <a class="brand" routerLink="/dashboard" aria-label="Trébol, ir al resumen">
      <app-logo [size]="34" />
    </a>

    <nav class="nav" aria-label="Principal">
      @for (l of links; track l.path) {
        <a [routerLink]="l.path" routerLinkActive="active">
          <app-icon [name]="l.icon" [size]="18" />{{ l.label }}
        </a>
      }
    </nav>

    @if (auth.profile(); as me) {
      <div class="me">
        <app-avatar [name]="me.display_name" [order]="me.turn_order" [size]="34" />
        <span class="me-name">{{ me.display_name }}</span>
        <button type="button" class="logout" (click)="auth.logout()" title="Cerrar sesión" aria-label="Cerrar sesión">
          <app-icon name="logout" [size]="18" />
        </button>
      </div>
    }
  </div>
</header>

@if (showBanner()) {
  <div class="banner" role="status">
    <div class="banner-inner">
      <span class="bell"><app-icon name="bell" [size]="18" /></span>
      <p>
        <strong>Te toca jugar a ti.</strong>
        Aún no hay jugadas para el sorteo del {{ draw() | date: "EEEE d 'a las' HH:mm" }}.
      </p>
      <a class="banner-cta" routerLink="/jugadas">Apuntar jugadas</a>
      <button type="button" class="banner-close" (click)="dismiss()" aria-label="Ocultar aviso hasta mañana">
        <app-icon name="x" [size]="16" />
      </button>
    </div>
  </div>
}

<main class="content">
  <router-outlet />
</main>

<nav class="tabbar" aria-label="Principal">
  @for (l of links; track l.path) {
    <a [routerLink]="l.path" routerLinkActive="active">
      <app-icon [name]="l.icon" [size]="22" />
      <span>{{ l.label }}</span>
    </a>
  }
</nav>
