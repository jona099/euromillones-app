<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Trébol · Peña Euromillones</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='11' r='9' fill='%2312b76a'/><circle cx='11' cy='26' r='9' fill='%2312b76a'/><circle cx='29' cy='26' r='9' fill='%2312b76a'/><circle cx='20' cy='22' r='5' fill='%23f5b915'/></svg>" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" />
  <script>
    /* Aplica tema y acento antes de pintar para que no haya destello. Mismas claves que ThemeService. */
    (function () {
      var mode = 'system', accent = 'trebol';
      try {
        mode = localStorage.getItem('trebol.theme') || mode;
        accent = localStorage.getItem('trebol.accent') || accent;
      } catch (e) {}
      var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var html = document.documentElement;
      html.setAttribute('data-theme', dark ? 'dark' : 'light');
      if (/^(trebol|oceano|rubi)$/.test(accent)) html.setAttribute('data-accent', accent);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#131a2e' : '#ffffff');
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Trébol" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* Loader de arranque: visible mientras se descarga el bundle; Angular lo retira con fade. */
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      display: grid; place-items: center; align-content: center; gap: 1rem;
      background: #0c1838 radial-gradient(ellipse 70% 60% at 50% 40%, rgb(18 183 106 / 0.18), transparent);
      color: rgb(255 255 255 / 0.7);
      font: 700 0.95rem/1 'Manrope', system-ui, sans-serif; letter-spacing: 0.02em;
      transition: opacity 0.35s ease, visibility 0.35s;
    }
    #boot.out { opacity: 0; visibility: hidden; }
    #boot svg { width: 84px; height: 84px; overflow: visible; }
    #boot .b { transform-box: fill-box; transform-origin: 50% 100%; animation: boot-pop 1.6s cubic-bezier(.3,.7,.4,1) infinite both; }
    #boot .b2 { animation-delay: .15s; } #boot .b3 { animation-delay: .3s; }
    #boot .s { transform-box: fill-box; transform-origin: center; animation: boot-star 1.6s ease-in-out infinite both; animation-delay: .45s; }
    @keyframes boot-pop {
      0% { transform: translateY(6px) scale(.6); opacity: 0; }
      22% { transform: translateY(-4px) scale(1.05); opacity: 1; }
      36%, 80% { transform: none; opacity: 1; }
      100% { transform: none; opacity: 1; }
    }
    @keyframes boot-star {
      0%, 20% { transform: scale(.4) rotate(-90deg); opacity: 0; }
      45% { transform: scale(1.25) rotate(20deg); opacity: 1; filter: drop-shadow(0 0 6px #f5b915); }
      60%, 100% { transform: scale(1) rotate(0); opacity: 1; filter: none; }
    }
    @media (prefers-reduced-motion: reduce) { #boot .b, #boot .s { animation: none; } }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <circle class="b b1" cx="20" cy="11" r="9" fill="#12b76a" />
      <circle class="b b2" cx="11" cy="26" r="9" fill="#0fa45e" />
      <circle class="b b3" cx="29" cy="26" r="9" fill="#17c777" />
      <path class="s" d="M20 15.5l1.9 3.9 4.3.6-3.1 3 .7 4.3-3.8-2-3.8 2 .7-4.3-3.1-3 4.3-.6z" fill="#f5b915" />
    </svg>
    <span>Cargando Trébol…</span>
  </div>
  <app-root></app-root>
</body>
</html>
